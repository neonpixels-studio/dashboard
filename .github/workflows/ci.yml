name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint:ci
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
      - run: npm run typecheck
      - run: npm run test:ci

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'app/**'
              - 'server/**'
              - 'shared/**'
              - 'public/**'
              - 'e2e/**'
              - 'nuxt.config.ts'
              - 'playwright.config.ts'
              - 'drizzle.config.ts'
              - 'package-lock.json'
              - 'package.json'
              - '.nvmrc'
              - '.env.e2e'
              - '.github/workflows/ci.yml'

  generate-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test-files: ${{ steps.find-tests.outputs.test-files }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: find-tests
        run: |
          # `-printf '%P\n'` keeps the path relative to `e2e/` (unlike
          # `basename`, which would flatten `e2e/sub/foo.spec.ts` to `foo`,
          # colliding with any other `foo.spec.ts` elsewhere and producing a
          # matrix entry whose "e2e/$TEST_FILE.spec.ts" path doesn't exist).
          files=$(find e2e -name "*.spec.ts" -printf '%P\n' | sed 's/\.spec\.ts$//' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          # An empty matrix would make the `e2e` job report `skipped`, which
          # `e2e-gate` treats as a pass — silently stopping all e2e coverage.
          # Fail loudly instead so a broken glob can't slip through green.
          if [ "$files" = "[]" ]; then
            echo "No e2e spec files found under e2e/ — check the find glob above." >&2
            exit 1
          fi
          echo "test-files=$files" >> $GITHUB_OUTPUT

  e2e:
    needs: [ci, changes, generate-matrix]
    if: |
      !cancelled() &&
      needs.ci.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.src == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Each shard holds its own Neon branch, and the free plan caps the project
    # at 10 (production, development and e2e take 3), so whole e2e runs queue
    # behind each other repo-wide instead of overlapping. The lock lives on
    # this caller job, not on the matrix job in e2e.yml: job-level
    # concurrency on a matrix serializes the shards themselves. GitHub keeps
    # only one *pending* run per group; a third queued run cancels the older
    # pending one, which then needs a re-run.
    # @todo Delete this concurrency block after upgrading past Neon's free plan.
    concurrency:
      group: e2e-neon
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      test-files: ${{ needs.generate-matrix.outputs.test-files }}
    secrets:
      DOTENV_PRIVATE_KEY_E2E: ${{ secrets.DOTENV_PRIVATE_KEY_E2E }}

  e2e-gate:
    name: E2E Gate
    needs: [e2e, ci, changes, generate-matrix]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report status
        env:
          RESULT: ${{ needs.e2e.result }}
          CI_RESULT: ${{ needs.ci.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
        run: |
          # `e2e`'s `if:` requires `ci` and `changes` to succeed, and reads
          # `generate-matrix`'s output via `fromJson(...)` — so a `ci` or
          # `changes` failure makes `e2e` report `skipped`, while a
          # `generate-matrix` failure makes `e2e` itself error out evaluating
          # `fromJson('')`. Either way, checking `needs.e2e.result` alone
          # isn't enough: a `skipped` would read as a pass here, silently
          # swallowing exactly the kind of broken filter/glob/lint failure
          # this gate exists to catch. Check every upstream job's actual
          # result directly instead of inferring anything from e2e's.
          if [[ "$CI_RESULT" != "success" || "$CHANGES_RESULT" != "success" || "$MATRIX_RESULT" != "success" ]]; then
            echo "Upstream job failed (ci: $CI_RESULT, changes: $CHANGES_RESULT, generate-matrix: $MATRIX_RESULT)"
            exit 1
          fi
          if [[ "$RESULT" == "success" || "$RESULT" == "skipped" ]]; then
            echo "E2E: $RESULT"
          else
            echo "E2E failed with result: $RESULT"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Pinned to the same version developers run locally in .husky/pre-commit,
      # so a scan can't pass one place and fail the other. Installed from the
      # release tarball rather than gitleaks-action to avoid its org license
      # requirement.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      # Scans the checked-out tree (gitignored local files like .env.keys are
      # absent on a fresh clone), catching any secret committed to the branch —
      # including one pushed past the local pre-commit hook with --no-verify.
      - name: Scan for secrets
        run: gitleaks dir . --redact --config .gitleaks.toml

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      # No install step: `npm audit` resolves the tree straight from
      # package-lock.json without node_modules, and audit-gate.js only
      # imports Node built-ins. This job's whole purpose is to distrust the
      # dependency tree, so it must never give any dependency's (potentially
      # compromised) install script a chance to run — skipping the install
      # entirely closes that off completely, rather than merely limiting it.
      # Verified: identical advisory counts with and without a prior `npm ci`.
      - name: Audit dependencies (fail on high/critical)
        # Fails the build only on un-allowlisted high or critical advisories.
        # `npm audit` exits non-zero whenever it finds advisories, so capture the
        # JSON with `|| true` and let scripts/audit-gate.js decide pass/fail
        # against the documented allowlist in scripts/audit-allowlist.js.
        run: |
          set -o pipefail
          { npm audit --json || true; } | node scripts/audit-gate.js
      - name: Audit summary (moderate/low — informational)
        # Never fails the build; surfaces the full advisory breakdown for context.
        if: always()
        run: npm audit || true
