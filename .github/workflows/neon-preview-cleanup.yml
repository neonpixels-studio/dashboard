name: Neon preview cleanup

# Deletes the Neon branch a Netlify build created (see
# scripts/neon-preview-branch.js): preview/pr-<n> once the PR is merged or
# closed, branch/<git branch> once the git branch is deleted. A PR or branch
# that never got a Netlify build has no Neon branch, which is a no-op.
on:
  pull_request:
    types: [closed]
  delete:

jobs:
  delete-preview-branch:
    # `delete` also fires for tags, which never get a branch deploy.
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      # Fails the run (rather than warning) if the delete fails, so a leaked
      # branch shows up as a red check on the closed PR.
      - run: npx dotenvx run -f .env.e2e -- node scripts/neon-preview-branch.js delete
        env:
          DOTENV_PRIVATE_KEY_E2E: ${{ secrets.DOTENV_PRIVATE_KEY_E2E }}
          # Mirrors the Netlify build variables the script names branches from.
          CONTEXT: ${{ github.event_name == 'pull_request' && 'deploy-preview' || 'branch-deploy' }}
          REVIEW_ID: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.ref }}
