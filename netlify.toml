# Production deploys: `npm run build` is `dotenvx run -f .env.production --
# nuxt build`, so it decrypts .env.production with DOTENV_PRIVATE_KEY_PRODUCTION
# (set in Netlify env, Builds scope) and bakes NUXT_* values into the bundle.
[build]
  command = "npx nuxt prepare && npm run test:ci && npm run build && npm run assert:no-sourcemaps"
  publish = "dist"

# Deploy previews and branch deploys decrypt .env.dev instead, via
# DOTENV_PRIVATE_KEY_DEV, so they never build against the production database.
# Each deploy preview (preview/pr-<n>) and branch deploy (branch/<git branch>)
# gets its own Neon branch, a copy-on-write fork of `production`, via
# scripts/neon-preview-branch.js. They're deleted when the PR closes or the git
# branch is deleted (.github/workflows/neon-preview-cleanup.yml).
[context.production]
  # Netlify cancels the build when this exits 0 and builds when it exits 1.
  # Production deploys only via the build hook (weekly workflow or manual dispatch).
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"

[context.deploy-preview]
  command = "npx nuxt prepare && npm run test:ci && npm run build:preview && npm run assert:no-sourcemaps"

[context.branch-deploy]
  command = "npx nuxt prepare && npm run test:ci && npm run build:preview && npm run assert:no-sourcemaps"

# Functions run as standalone Lambdas and don't get the dotenvx-decrypted
# values `nuxt build` bakes into the app bundle. Ship the encrypted file so
# netlify/functions/env.ts can decrypt it at runtime with
# DOTENV_PRIVATE_KEY_PRODUCTION (which must also be scoped to Functions).
[functions]
  included_files = [".env.production"]
